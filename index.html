<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下新池 新栄車 現在地</title>
<style>
  body{
    margin:0; min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#1a1a2e; color:#fff; text-align:center;
    padding:24px; padding-bottom:14svh; box-sizing:border-box;
  }
  .lantern{margin-bottom:16px;}
  .lantern svg{display:block; margin:0 auto;}
  h1{font-size:22px; margin:0 0 8px;}
  p{font-size:16px; line-height:1.7; color:#ddd; margin:4px 0;}
  a.btn{
    display:inline-block; margin-top:20px; padding:14px 28px;
    background:#e8541e; color:#fff; text-decoration:none;
    border-radius:8px; font-size:18px; font-weight:bold;
  }
  .off{color:#aaa;}
</style>
</head>
<body>

<!-- ================================================================ -->
<!--  その日の共有リンクは share-url.txt に書く（このHTMLは触らない）  -->
<!--  share-url.txt の全文 = Googleマップ共有リンク1行。               -->
<!--  配信していない時（祭り前・夜間・終了後）は空にする。             -->
<!--  毎朝の差し替えはiPhoneのショートカットから自動で行う。           -->
<!-- ================================================================ -->

<div class="lantern" aria-hidden="true">
<svg width="100" height="140" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
  <!-- 吊り紐と上下の枠 -->
  <line x1="50" y1="0" x2="50" y2="7" stroke="#111" stroke-width="2"/>
  <rect x="31" y="6" width="38" height="12" rx="3" fill="#1c1c1c"/>
  <rect x="33" y="123" width="34" height="11" rx="3" fill="#1c1c1c"/>
  <!-- 提灯の本体 -->
  <ellipse cx="50" cy="71" rx="38" ry="55" fill="#f6efdd"/>
  <!-- 骨（ひご） -->
  <path d="M 14 54 Q 50 61 86 54" fill="none" stroke="#d9cdb0" stroke-width="1.5"/>
  <path d="M 12 71 Q 50 78 88 71" fill="none" stroke="#d9cdb0" stroke-width="1.5"/>
  <path d="M 14 88 Q 50 95 86 88" fill="none" stroke="#d9cdb0" stroke-width="1.5"/>
  <!-- 赤帯 -->
  <path d="M 20 32 Q 50 40 80 32" fill="none" stroke="#c0392b" stroke-width="6"/>
  <path d="M 21 109 Q 50 116 79 109" fill="none" stroke="#c0392b" stroke-width="6"/>
  <!-- 文字 -->
  <g fill="#1a1a1a" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-weight="bold" font-size="24" text-anchor="middle">
    <text x="50" y="58">新</text>
    <text x="50" y="83">栄</text>
    <text x="50" y="108">車</text>
  </g>
</svg>
</div>
<div id="msg">
  <h1>下新池 新栄車</h1>
  <p class="off">読み込み中…</p>
</div>

<script>
  function showOff() {
    document.getElementById("msg").innerHTML =
      '<h1>下新池 新栄車</h1>' +
      '<p class="off">ただいま位置情報は配信していません。</p>' +
      '<p class="off">お祭り当日の運行時間中にご覧ください。</p>';
  }
  fetch("share-url.txt?ts=" + Date.now(), { cache: "no-store" })
    .then(function (res) { return res.ok ? res.text() : ""; })
    .then(function (text) {
      var url = (text || "").trim();
      if (url.indexOf("https://") === 0) {
        document.getElementById("msg").innerHTML =
          '<h1>新栄車の現在地マップを開きます</h1>' +
          '<p>開いた地図に「現在地を共有」というボタンが出ますが、<strong>押す必要はありません</strong>。<br>そのまま新栄車の場所をご覧いただけます。</p>' +
          '<a class="btn" href="' + url + '">地図を開く</a>' +
          '<p class="off" id="count">5秒後に自動で開きます</p>';
        var n = 5;
        var t = setInterval(function () {
          n--;
          if (n <= 0) {
            clearInterval(t);
            location.replace(url);
          } else {
            document.getElementById("count").textContent = n + "秒後に自動で開きます";
          }
        }, 1000);
      } else {
        showOff();
      }
    })
    .catch(showOff);
</script>

</body>
</html>
