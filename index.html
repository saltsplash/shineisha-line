<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下新池 新栄車 現在地</title>
<style>
  body{
    margin:0; min-height:100vh; min-height:100svh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#1e4a6e; color:#fff; text-align:center;
    padding:24px; padding-bottom:14svh; box-sizing:border-box;
  }
  .lantern{margin-bottom:16px;}
  .lantern svg{display:block; margin:0 auto;}
  h1{font-size:22px; margin:0 0 8px;}
  p{font-size:16px; line-height:1.7; color:#ddd; margin:4px 0;}
  a.btn{
    display:inline-block; margin-top:20px; padding:14px 28px;
    background:#e8541e; color:#fff; text-decoration:none;
    border-radius:8px; font-size:18px; font-weight:bold;
  }
  .off{color:#c9d6e2;}
</style>
</head>
<body>

<!-- ================================================================ -->
<!--  その日の共有リンクは share-url.txt に書く（このHTMLは触らない）  -->
<!--  share-url.txt の全文 = Googleマップ共有リンク1行。               -->
<!--  配信していない時（祭り前・夜間・終了後）は空にする。             -->
<!--  毎朝の差し替えはiPhoneのショートカットから自動で行う。           -->
<!-- ================================================================ -->

<div class="lantern" aria-hidden="true">
<svg width="120" height="168" viewBox="0 0 120 168" xmlns="http://www.w3.org/2000/svg">
  <!-- 吊り紐 -->
  <line x1="60" y1="0" x2="60" y2="12" stroke="#10151a" stroke-width="3"/>
  <!-- 上枠 -->
  <rect x="29" y="12" width="62" height="13" rx="4" fill="#17171c"/>
  <rect x="33" y="25" width="54" height="3" fill="#0e0e12"/>
  <!-- 胴（樽型） -->
  <path d="M 27 28 C 8 62 8 112 27 144 L 93 144 C 112 112 112 62 93 28 Z" fill="#f5eedb"/>
  <!-- 側面の陰 -->
  <path d="M 27 28 C 8 62 8 112 27 144 L 36 144 C 20 112 20 62 36 28 Z" fill="#000" opacity="0.05"/>
  <path d="M 93 28 C 112 62 112 112 93 144 L 84 144 C 100 112 100 62 84 28 Z" fill="#000" opacity="0.05"/>
  <!-- 骨（ひご） -->
  <g fill="none" stroke="#d9cfb4" stroke-width="1">
    <path d="M 18 52 Q 60 56 102 52"/>
    <path d="M 15 66 Q 60 70 105 66"/>
    <path d="M 14 80 Q 60 84 106 80"/>
    <path d="M 14 94 Q 60 98 106 94"/>
    <path d="M 16 108 Q 60 112 104 108"/>
    <path d="M 19 122 Q 60 126 101 122"/>
  </g>
  <!-- 上下の赤の二重線 -->
  <g fill="none" stroke="#bf3527" stroke-width="3">
    <path d="M 24 35 Q 60 39 96 35"/>
    <path d="M 22 42 Q 60 46 98 42"/>
    <path d="M 22 130 Q 60 134 98 130"/>
    <path d="M 25 137 Q 60 141 95 137"/>
  </g>
  <!-- 文字 -->
  <g fill="#141414" font-family="'Yu Mincho','Hiragino Mincho ProN',serif" font-weight="bold" font-size="28" text-anchor="middle">
    <text x="60" y="70">新</text>
    <text x="60" y="98">栄</text>
    <text x="60" y="126">車</text>
  </g>
  <!-- 下枠 -->
  <rect x="31" y="144" width="58" height="12" rx="4" fill="#17171c"/>
</svg>
</div>
<div id="msg">
  <h1>下新池 新栄車</h1>
  <p class="off">読み込み中…</p>
</div>

<script>
  function showOff() {
    document.getElementById("msg").innerHTML =
      '<h1>下新池 新栄車</h1>' +
      '<p class="off">ただいま位置情報は配信していません。</p>' +
      '<p class="off">お祭り当日の運行時間中にご覧ください。</p>';
  }
  fetch("share-url.txt?ts=" + Date.now(), { cache: "no-store" })
    .then(function (res) { return res.ok ? res.text() : ""; })
    .then(function (text) {
      var url = (text || "").trim();
      if (url.indexOf("https://") === 0) {
        document.getElementById("msg").innerHTML =
          '<h1>新栄車の現在地マップを開きます</h1>' +
          '<p>開いた地図に「現在地を共有」というボタンが出ますが、<strong>押す必要はありません</strong>。<br>そのまま新栄車の場所をご覧いただけます。</p>' +
          '<a class="btn" href="' + url + '">地図を開く</a>' +
          '<p class="off" id="count">5秒後に自動で開きます</p>';
        var n = 5;
        var t = setInterval(function () {
          n--;
          if (n <= 0) {
            clearInterval(t);
            location.replace(url);
          } else {
            document.getElementById("count").textContent = n + "秒後に自動で開きます";
          }
        }, 1000);
      } else {
        showOff();
      }
    })
    .catch(showOff);
</script>

</body>
</html>
